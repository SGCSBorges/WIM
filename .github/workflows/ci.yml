name: ci
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres service is only used by the Prisma drift check below as a
    # shadow database. The API tests don't talk to it (they mock Prisma).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wim_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # `npm install` (not `npm ci`) so a stale package-lock.json doesn't
      # block CI when a dependency is added or bumped. Render's
      # render-build:web does the same, so dev/CI/prod stay aligned.
      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root --include=optional

      - name: Lint (all workspaces)
        run: npm run lint

      # Round-8 cost an extra round-trip when prettier formatting errors hid
      # inside `npm run lint` output. A dedicated format check surfaces the
      # same failures with a distinct red step name. Scope mirrors the
      # per-workspace ESLint globs (API ignores src/__tests__/**) so this
      # check stays consistent with `npm run lint`.
      - name: Format check (prettier)
        run: |
          npx prettier --check \
            "apps/api/src/**/*.{ts,js}" \
            "!apps/api/src/__tests__/**" \
            "apps/web/src/**/*.{ts,tsx}" \
            "packages/**/src/**/*.ts"

      - name: API - Prisma generate
        working-directory: apps/api
        run: npm run prisma:generate

      - name: API - Build
        working-directory: apps/api
        run: npm run build

      # Strict TypeScript check on the web workspace. Vite's build is
      # transpile-only and won't fail on type errors, so without this step
      # `TS2345` / `TS2724` regressions ship to prod.
      - name: Web - Typecheck
        working-directory: apps/web
        run: npm run typecheck

      # Detect schema drift: fails if schema.prisma is ahead of the
      # migrations folder (someone edited the model without `prisma migrate
      # dev`). Prisma applies the migration history to the shadow DB
      # service above, then diffs the resulting state against schema.prisma.
      - name: API - Prisma migration drift check
        working-directory: apps/api
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wim_shadow
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
        continue-on-error: false

      # Unit tests + coverage gate (thresholds in each vitest.config.ts).
      - name: API - Test (coverage)
        working-directory: apps/api
        run: npm run test:coverage

      # Integration tests against the Postgres service above. They self-skip
      # when INTEGRATION_DATABASE_URL is unset; here we point them at the
      # service DB (the drift check ran first and leaves it reusable — the
      # suite runs `prisma migrate deploy` and truncates between tests).
      - name: API - Integration tests
        working-directory: apps/api
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wim_shadow
          JWT_SECRET: ci-integration-secret
        run: npm run test:integration

      - name: Web - Test (coverage)
        working-directory: apps/web
        run: npm run test:coverage

      - name: Web - Build
        working-directory: apps/web
        run: npm run build

      - name: Upload web dist artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # On pushes to main/dev, a high-severity vuln fails CI so a fresh CVE
      # can't ship to prod undetected. On PRs we keep it advisory so a new
      # contributor isn't blocked mid-review by a transitive upstream issue.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: ${{ github.event_name == 'pull_request' }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
