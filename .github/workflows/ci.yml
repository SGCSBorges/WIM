name: ci
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Cancel an in-flight run when a newer push lands on the same ref. Without
# this, three commits in a minute produce three full CI runs that all do the
# same work — Postgres service spin-up included. The latest commit is the
# one we actually care about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres service is only used by the Prisma drift check below as a
    # shadow database. The API tests don't talk to it (they mock Prisma).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wim_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Lint (all workspaces)
        run: npm run lint

      # Round-8 cost an extra round-trip when prettier formatting errors hid
      # inside `npm run lint` output. A dedicated format check surfaces the
      # same failures with a distinct red step name. Scope mirrors the
      # per-workspace ESLint globs (API ignores src/__tests__/**) so this
      # check stays consistent with `npm run lint`.
      - name: Format check (prettier)
        run: |
          npx prettier --check \
            "apps/api/src/**/*.{ts,js}" \
            "!apps/api/src/__tests__/**" \
            "apps/web/src/**/*.{ts,tsx}" \
            "packages/**/src/**/*.ts"

      - name: API - Prisma generate
        working-directory: apps/api
        run: npm run prisma:generate

      - name: API - Build
        working-directory: apps/api
        run: npm run build

      # Strict TypeScript check on the web workspace. Vite's build is
      # transpile-only and won't fail on type errors, so without this step
      # `TS2345` / `TS2724` regressions ship to prod.
      - name: Web - Typecheck
        working-directory: apps/web
        run: npm run typecheck

      # Detect schema drift: fails if schema.prisma is ahead of the
      # migrations folder (someone edited the model without `prisma migrate
      # dev`). Prisma applies the migration history to the shadow DB
      # service above, then diffs the resulting state against schema.prisma.
      - name: API - Prisma migration drift check
        working-directory: apps/api
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wim_shadow
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
        continue-on-error: false

      # Unit tests + coverage gate (thresholds in each vitest.config.ts).
      - name: API - Test (coverage)
        working-directory: apps/api
        run: npm run test:coverage

      # Integration tests against the Postgres service above. They self-skip
      # when INTEGRATION_DATABASE_URL is unset; here we point them at the
      # service DB (the drift check ran first and leaves it reusable — the
      # suite runs `prisma migrate deploy` and truncates between tests).
      # `--retry=1` auto-reruns a failed test once. A deterministic failure
      # still fails twice and surfaces; a transient blip (DB readiness
      # flake, IP-shared rate-limit window edge) recovers without a
      # hand-restart.
      - name: API - Integration tests
        working-directory: apps/api
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wim_shadow
          JWT_SECRET: ci-integration-secret
        run: npx vitest run src/__tests__/integration --retry=1

      - name: Web - Test (coverage)
        working-directory: apps/web
        run: npm run test:coverage

      - name: Web - Build
        working-directory: apps/web
        run: npm run build

      - name: Upload web dist artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: apps/web/dist

      # On pushes to main/dev, a high-severity vuln fails CI so a fresh CVE
      # can't ship to prod undetected. On PRs we keep it advisory so a new
      # contributor isn't blocked mid-review by a transitive upstream issue.
      #
      # Scoped to production deps (`--omit=dev`): the gate exists to keep a
      # high/critical vuln out of the *shipped* runtime. Dev-only tooling
      # (vitest/vite) doesn't ship and CI runs `vitest run`, never the UI
      # server an advisory like GHSA-5xrq-8626-4rwp requires — so a major
      # bump of the test stack would be disproportionate to the actual risk.
      - name: npm audit (moderate+, prod deps)
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: ${{ github.event_name == 'pull_request' }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Playwright E2E smoke tests. The webServer in playwright.config.ts builds
  # and serves the static app so no running API is needed — the suite only
  # exercises API-free UI (theme, nav, login screen rendering, etc.).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: apps/web
        run: npm run test:e2e

      # On failure, keep the HTML report (offending-element diagnostics +
      # traces on the retried run) so a red run can be inspected without a
      # local re-run.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The docs/uml/*.svg are rendered artifacts of the *.puml sources, committed
  # so GitHub shows them inline. Re-render and fail if any committed SVG is
  # stale — same drift-check ethos as the Prisma `migrate diff` above. The
  # render is deterministic (pinned PlantUML image + -nometadata), so a clean
  # tree means the SVGs match their sources. Advisory on PRs (a transient
  # registry/Docker hiccup shouldn't block a review); gating on push.
  uml:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Render UML diagrams
        run: npm run docs:uml

      - name: Check SVGs are in sync with sources
        run: |
          if ! git diff --exit-code -- docs/uml; then
            echo "::error::docs/uml SVGs are stale — run 'npm run docs:uml' and commit the result."
            exit 1
          fi
