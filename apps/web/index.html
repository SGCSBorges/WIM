<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="description" content="WIM — suivez vos biens, vos garanties et vos alertes." />

    <!-- Social link previews (Slack/iMessage/Twitter/etc.). The runtime
         theme.tsx replaces the theme-color metas above with a single
         media-less one matching the active theme. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="WIM" />
    <meta property="og:title" content="WIM — Gestionnaire de garanties &amp; inventaire" />
    <meta property="og:description" content="Suivez vos biens, vos garanties et vos alertes — et soyez prévenu avant qu'une garantie n'expire." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WIM — Gestionnaire de garanties &amp; inventaire" />
    <meta name="twitter:description" content="Suivez vos biens, vos garanties et vos alertes — et soyez prévenu avant qu'une garantie n'expire." />
    <meta name="twitter:image" content="/icon-512.png" />

    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores manifest.webmanifest for "Add to Home Screen" — these are
         what make the installed icon launch as a standalone app instead of a
         bookmarked Safari tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WIM" />

    <title>WIM — Gestionnaire de garanties &amp; inventaire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
