<g class="entity" data-entity="GMN2" data-source-line="21" data-uid="ent0003" id="entity_GMN2">
<path d="M741.45,155.2969 L741.45,186.5569 L706.58,190.5569 L741.45,194.5569 L741.45,225.8281 A0,0 0 0 0 741.45,225.8281 L1079.1409,225.8281 A0,0 0 0 0 1079.1409,225.8281 L1079.1409,165.2969 L1069.1409,155.2969
L741.45,155.2969 A0,0 0 0 0 741.45,155.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
<path d="M1069.1409,155.2969 L1069.1409,165.2969 L1079.1409,165.2969 L1069.1409,155.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.5176" x="747.45" y="172.3638">Direction PUSH = l'owner offre &#224; un e-mail ;</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.2061" x="747.45" y="187.4966">PULL = un Power User r&#233;clame un article visible</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.4932" x="747.45" y="202.6294">(partag&#233; publiquement ou via InventoryShare).</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.6909" x="747.45" y="217.7622">Le jeton est envoy&#233; &#224; la partie qui doit accepter.</text>
</g>
<g class="entity" data-entity="GMN5" data-source-line="28" data-uid="ent0006" id="entity_GMN5">
<path d="M136.95,332.8269 L136.95,479.0222 L619.6531,479.0222 L619.6531,342.8269 L609.6531,332.8269 L136.95,332.8269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
<path d="M609.6531,332.8269 L609.6531,342.8269 L619.6531,342.8269 L609.6531,332.8269" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.2012" x="142.95" y="349.8938">Acceptation = une seule transaction Prisma :</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="357.7476" x="142.95" y="365.0266">- r&#244;le du receveur re-v&#233;rifi&#233; share-capable DANS la tx ;</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.3369" x="142.95" y="380.1594">- transition atomique updateMany WHERE status=PENDING</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5776" x="151.2146" y="395.2922">(count===0 &#8594; 409, anti-course) ;</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.0825" x="142.95" y="410.425">- r&#233;-attribution : Article + Garantie + WarrantyHistory</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.2163" x="151.2146" y="425.5578">+ Alerte + Attachment + ArticleNote au nouvel owner ;</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.1167" x="142.95" y="440.6906">- ArticleLocation + ArticleTag supprim&#233;s (scoping owner) ;</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="461.7031" x="142.95" y="455.8235">- toutes les AUTRES demandes PENDING du m&#234;me article &#8594; REVOKED.</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.5308" x="142.95" y="470.9563">Audit : ARTICLE_TRANSFER_ACCEPT (+ INIT/REJECT/REVOKE).</text>
</g>
<g class="entity" data-entity="GMN8" data-source-line="40" data-uid="ent0009" id="entity_GMN8">
<path d="M129.99,540.0269 L129.99,625.6909 L626.6135,625.6909 L626.6135,550.0269 L616.6135,540.0269 L129.99,540.0269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
<path d="M616.6135,540.0269 L616.6135,550.0269 L626.6135,550.0269 L616.6135,540.0269" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.4067" x="135.99" y="557.0938">status est un VarChar(20), pas un enum DB</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="475.6235" x="135.99" y="572.2266">(PENDING|ACCEPTED|REJECTED|REVOKED|EXPIRED) &#8212; valid&#233; au service.</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="422.7856" x="135.99" y="587.3594">reject + revoke restent sur authGuard seul (pas requireFeature),</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="449.9727" x="135.99" y="602.4922">pour qu'une demande en attente reste toujours d&#233;clinable/annulable</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.8882" x="135.99" y="617.625">m&#234;me si la feature &#171; transfers &#187; est restreinte plus tard.</text>
</g>
