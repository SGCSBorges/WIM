<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="431.6533" x="496.19" y="651.2238">La suppression est un soft-delete (deletedAt). Les lectures &#171; live
&#187;</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="409.4365" x="496.19" y="666.3566">filtrent deletedAt = null ; la Corbeille liste les lignes marqu&#233;es.</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.6758" x="496.19" y="681.4894">Le worker de maintenance hard-delete au-del&#224; de</text>
