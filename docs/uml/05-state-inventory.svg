<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="428.0415" x="12" y="643.6638">claimStatus vit sur la Garantie. NONE tant qu'aucune r&#233;clamation</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.6943" x="12" y="658.7966">n'est ouverte ; les transitions sont surfac&#233;es sur la timeline de</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.5703" x="12" y="673.9294">l'article, le PDF de r&#233;clamation et le flux iCal. Le flux dessin&#233;</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.9653" x="12" y="689.0622">est le parcours nominal : l'API ne verrouille pas les transitions</text>
<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.6733" x="12" y="704.195">(repasser &#224; NONE efface note + horodatage de la r&#233;clamation).</text>
</g>
